name: kkumikkumi-sync
services:
  sync:
    image: kkumikkumi-sync:${KKUMI_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/sync-server/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - sync-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
volumes:
  sync-data:
